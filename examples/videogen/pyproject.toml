[project]
name = "videogen"
version = "0.1.0"
description = "End-to-end video-diffusion training on LanceDB + Geneva — Wan2.2 LoRA on time-lapse phase transitions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Data layer
    "lancedb>=0.30.0",
    "pylance>=0.36.0",
    "geneva",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",

    # Source corpus / EDA
    "datasets>=2.18.0",
    "huggingface-hub>=0.24.0",
    "yt-dlp>=2024.10.0",
    "tqdm>=4.66.0",

    # Video / image IO
    "Pillow>=10.0.0",
    "decord>=0.6.0",
    "imageio[ffmpeg]>=2.34.0",
    "av>=12.0.0",

    # Training-side (heavy; only used by GPU jobs)
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "diffusers>=0.32.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    "sentencepiece>=0.2.0",
    "open-clip-torch>=2.24.0",

    # Optional: training observability
    "wandb",
]

[project.scripts]
videogen-ingest         = "videogen.ingest_chronomagic:main"
videogen-backfill       = "videogen.backfill_geneva:main"
videogen-views          = "videogen.manage_views:main"
videogen-verify         = "videogen.verify_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videogen"]
